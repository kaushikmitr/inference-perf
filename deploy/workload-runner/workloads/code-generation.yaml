load:
  type: concurrent
  num_workers: 6
  request_timeout: 300.0
  # Multi-stage: num_requests = max(c × 3, num_conversations) per stage so every
  # conversation is touched at every c-level (warms cluster cache for all 80
  # convs) while still exercising multi-turn at higher c. c=10/20 only do
  # turn_0 within their stage; cross-stage cache reuse covers the rest.
  stages:
    - num_requests: 80
      concurrency_level: 10
    - num_requests: 80
      concurrency_level: 20
    - num_requests: 90
      concurrency_level: 30
    - num_requests: 120
      concurrency_level: 40
    - num_requests: 150
      concurrency_level: 50
    - num_requests: 180
      concurrency_level: 60
    - num_requests: 210
      concurrency_level: 70
    - num_requests: 240
      concurrency_level: 80
api:
  type: completion
  streaming: ${STREAMING_MODE}
  headers:
    x-slo-tpot-ms: "${SLO_TPOT_MS}"
    x-slo-ttft-ms: "${SLO_TTFT_MS}"
    x-gateway-inference-objective: ${SHEDDABLE}
  slo_tpot_header: x-slo-tpot-ms
server:
  type: vllm
  model_name: ${MODEL_NAME}
  base_url: ${BASE_URL}
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: ${MODEL_NAME}
metrics:
  type: prometheus
  prometheus:
    url: http://prometheus-server.wva-monitoring.svc.cluster.local:80
    scrape_interval: 15
    google_managed: false
report:
  request_lifecycle:
    summary: true
    per_stage: true
  prometheus:
    summary: true
    per_stage: true
storage:
  google_cloud_storage:
    bucket_name: ${GCS_BUCKET}
    path: ${OUTPUT_DIR}
    report_file_prefix: ${REPORT_PREFIX}
data:
  type: conversation_replay
  conversation_replay:
    seed: 42
    num_conversations: 80
    shared_system_prompt_len: 3000
    dynamic_system_prompt_len:
      type: uniform
      min: 15000
      max: 120000
      mean: 55000
      std_dev: 25000
    turns_per_conversation:
      type: normal
      min: 2
      max: 20
      mean: 6
      std_dev: 3.5
    input_tokens_per_turn:
      type: lognormal
      min: 100
      max: 10000
      mean: 1500
      std_dev: 1200
    output_tokens_per_turn:
      type: lognormal
      min: 50
      max: 4000
      mean: 800
      std_dev: 600
    tool_call_latency_sec:
      type: lognormal
      min: 15
      max: 120
      mean: 45
      std_dev: 25
