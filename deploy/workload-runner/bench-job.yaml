apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-${SUFFIX}
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: "gmp-test-sa"
      nodeSelector:
        cloud.google.com/gke-nodepool: "pool-3"
      shareProcessNamespace: true
      containers:
        - name: inference-perf
          image: us-docker.pkg.dev/kaushikmitra-gke-dev/kaushikmitra-docker-repo/inference-perf:gmp-metrics-fix
          imagePullPolicy: Always
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
          command: ["inference-perf"]
          args: ["--config_file", "/etc/config/config.yml"]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: config-volume
          configMap:
            name: inference-perf-config-${SUFFIX}
